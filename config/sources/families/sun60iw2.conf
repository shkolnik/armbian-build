# Allwinner A733 (sun60iw2) family — Orange Pi 4 Pro.
#
# Originally derived from Nick Alilovic's sun60iw2 family work for the Radxa
# Cubie A7A/A7Z/A7S (https://github.com/NickAlilovic/build, branch Radxa-A7A).
# Trimmed to Orange Pi 4 Pro only: uses Orange Pi's vendor kernel tree and
# prebuilt vendor boot blobs (see packages/blobs/sunxi/sun60iw2/opi4pro/).
#

declare -g LINUXFAMILY="sun60iw2"
declare -g ARCH="arm64"
declare -g ATF_COMPILE='no'
declare -g BOOTENV_FILE='sun60iw2.txt'
declare -g BOOTSCRIPT='boot-sun60iw2-opi.cmd:boot.cmd'
declare -g OVERLAY_DIR="/boot/dtb/allwinner/overlay"
declare -g EXTRAWIFI="no"
declare -g KERNEL_BTF="no"
declare -g INSTALL_HEADERS="yes"
declare -g OFFSET=32
declare -g SERIALCON="ttyS0"
# The vendor U-Boot is a 32-bit ARM binary: uInitrd must be tagged arch=arm,
# or bootm/booti rejects it ("No Linux ARM Ramdisk Image").
declare -g INITRD_ARCH=arm

KERNELSOURCE="${GITHUB_SOURCE}/orangepi-xunlong/linux-orangepi.git"
case "${BRANCH}" in
	legacy)
		# Allwinner BSP 5.15 (Bullseye-era; required for working GPU/VPU blobs).
		# Note: a linux-sun60iw2-opi-legacy.config is not shipped yet — add one
		# before selecting KERNEL_TARGET=legacy.
		KERNELBRANCH="branch:orange-pi-5.15-sun60iw2"
		declare -g KERNEL_MAJOR_MINOR="5.15"
		;;
	vendor)
		# Allwinner BSP 6.6 (current vendor kernel; default for this board).
		KERNELBRANCH="branch:orange-pi-6.6-sun60iw2"
		declare -g KERNEL_MAJOR_MINOR="6.6"
		;;
esac
KERNELPATCHDIR="archive/sun60iw2-opi-${BRANCH}"
LINUXCONFIG="linux-sun60iw2-opi-${BRANCH}"


function build_custom_uboot() {
	# Orange Pi 4 Pro ships prebuilt vendor boot blobs (boot0 + boot_package).
	# See packages/blobs/sunxi/sun60iw2/opi4pro/README.md for provenance and
	# build-boot-package.sh for the from-source reproduction.
	[[ -z "${uboottempdir:-}" ]] && exit_with_error "uboottempdir is not set by caller"
	[[ -z "${uboot_name:-}" ]] && exit_with_error "uboot_name is not set by caller"
	local opi_blob_dir="${SRC}/packages/blobs/sunxi/sun60iw2/opi4pro"
	[[ -f "${opi_blob_dir}/boot0_sdcard.fex" && -f "${opi_blob_dir}/boot_package.fex" ]] || \
		exit_with_error "Orange Pi boot blobs missing in ${opi_blob_dir} - see README.md there"
	mkdir -p "${uboottempdir}/usr/lib/${uboot_name}"
	cp "${opi_blob_dir}/boot0_sdcard.fex" "${uboottempdir}/usr/lib/${uboot_name}/"
	cp "${opi_blob_dir}/boot_package.fex" "${uboottempdir}/usr/lib/${uboot_name}/"
	[[ -f "${opi_blob_dir}/boot0_spinor.fex" ]] && cp "${opi_blob_dir}/boot0_spinor.fex" "${uboottempdir}/usr/lib/${uboot_name}/"
	declare -g EXTENSION_BUILT_UBOOT="yes"
	return 0
}


# SD/eMMC boot layout (matches orangepi-build sunxi64 'h616/h6 loader' path):
# boot0 at 8 KiB, boot_package at 8K*2050 = 16,793,600 bytes. First partition at 32 MiB.
function write_uboot_platform() {
	local SCRIPT_DIR="$1"
	local DEVICE="$2"

	dd conv=notrunc,fsync status=none if="$SCRIPT_DIR/boot0_sdcard.fex" of="$DEVICE" bs=8k seek=1
	dd conv=notrunc,fsync status=none if="$SCRIPT_DIR/boot_package.fex" of="$DEVICE" bs=8k seek=2050

	sync "${DEVICE}"
}

# Write the bootloader to SPI NOR flash (mtd0), enabling armbian-install's
# "Boot from MTD Flash - system on NVMe" option. SPI NOR layout (matches
# orangepi-build): boot0 at offset 0, boot_package at offset 262144 (256 KiB).
# Because the A733 BROM checks the SD card before SPI NOR, an inserted bootable
# SD card always overrides this -> SD-first, NVMe-as-fallback, and a botched SPI
# flash is always recoverable by booting an SD card. Needs mtd-utils in rootfs.
function write_uboot_platform_mtd() {
	local SCRIPT_DIR="$1"   # dir holding boot0_spinor.fex + boot_package.fex
	if [[ -c /dev/mtd0 ]]; then
		flash_erase /dev/mtd0 0 0
		mtd_debug write /dev/mtd0 0      "$(stat -c%s "$SCRIPT_DIR/boot0_spinor.fex")" "$SCRIPT_DIR/boot0_spinor.fex"
		mtd_debug write /dev/mtd0 262144 "$(stat -c%s "$SCRIPT_DIR/boot_package.fex")" "$SCRIPT_DIR/boot_package.fex"
		sync
	else
		echo "write_uboot_platform_mtd: /dev/mtd0 not found (no SPI NOR?)" >&2
		return 1
	fi
}


family_tweaks() {
	# execute specific tweaks function if present
	[[ $(type -t family_tweaks_s) == function ]] && family_tweaks_s

	# Orange Pi boot script loads uInitrd directly; keep extraargs minimal (headless server).
	echo "extraargs=coherent_pool=2M no_console_suspend fsck.fix=yes fsck.repair=yes" >> "${SDCARD}"/boot/armbianEnv.txt

	# AIC8800D80 WiFi/BT firmware: the armbian-firmware package ships the blobs at
	# /lib/firmware/aic8800/SDIO/aic8800D80/, but the in-tree vendor driver requests
	# them at the flat lowercase path /lib/firmware/aic8800d80/. Bridge with a symlink.
	if [[ -d "${SDCARD}/lib/firmware/aic8800/SDIO/aic8800D80" ]]; then
		ln -sfn aic8800/SDIO/aic8800D80 "${SDCARD}/lib/firmware/aic8800d80"
	else
		display_alert "aic8800D80 firmware not found in rootfs" "WiFi may not work; check armbian-firmware" "warn"
	fi

	# mtd-utils provides flash_erase/mtd_debug, needed by write_uboot_platform_mtd
	# (armbian-install "Boot from MTD Flash - system on NVMe").
	chroot_sdcard_apt_get_install mtd-utils
}
